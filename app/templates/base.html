<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CareerAgent</title>
    <link rel="stylesheet" href="/static/css/style.css?v=20260809-run-recovery-3">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  </head>
  <body data-page="{{ page }}">
    <header class="topbar">
      <a class="brand" href="/">
        <span class="brand-mark">CA</span>
        <span>CareerAgent</span>
      </a>
      <div class="topbar-actions">
        <nav class="nav">
          <a href="/" class="{{ 'active' if page == 'dashboard' else '' }}">开始</a>
          <a href="/ui/profiles" class="{{ 'active' if page == 'profiles' else '' }}">简历</a>
          <a href="/ui/jobs" class="{{ 'active' if page == 'jobs' else '' }}">岗位</a>
          <a href="/ui/resumes" class="{{ 'active' if page == 'resumes' else '' }}">定制简历</a>
          <a href="/ui/applications" class="{{ 'active' if page == 'applications' else '' }}">投递</a>
          <a href="/ui/prep" class="{{ 'active' if page == 'interview_prep' else '' }}">面试</a>
          <a href="/ui/agent-runs" class="{{ 'active' if page == 'agent_runs' else '' }}">历史记录</a>
        </nav>
        <a class="console-entry {{ 'active' if page in ['ops', 'evaluations'] else '' }}" href="/ui/ops">
          <i data-lucide="settings-2"></i>
          控制台
        </a>
      </div>
    </header>
    <div id="llm-global-warning" class="llm-global-warning" hidden></div>
    <main class="shell">
      {% block content %}{% endblock %}
    </main>
    <dialog id="run-confirmation-dialog" class="profile-picker-dialog run-confirmation-dialog">
      <div class="dialog-shell">
        <div class="panel-heading compact">
          <div>
            <p class="eyebrow">流程需要你的决定</p>
            <h2 id="run-confirmation-dialog-title">处理待确认事项</h2>
          </div>
          <button class="ghost compact-button" type="button" data-close-run-confirmation><i data-lucide="x"></i> 关闭</button>
        </div>
        <div id="global-run-confirmation" class="result-list compact-result"></div>
      </div>
    </dialog>
    <div id="active-run-monitor" class="active-run-monitor" hidden></div>
    <div id="toast" class="toast" hidden></div>
    <script src="/static/js/main.js?v=20260809-run-recovery-3"></script>
  </body>
</html>
