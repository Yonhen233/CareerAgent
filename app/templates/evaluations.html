{% extends "base.html" %}
{% block content %}
<section class="workspace-grid">
  <div class="panel span-5">
    <div class="panel-heading compact">
      <div>
        <p class="eyebrow">Interview sources</p>
        <h1>面经源探测</h1>
      </div>
    </div>
    <form id="interview-source-smoke-form" class="form-grid">
      <label class="wide">Query<input name="query" value="Agent 开发实习生 面经" required></label>
      <label>Limit<input name="limit" type="number" min="1" max="10" value="5"></label>
      <label>Sources<input name="sources" value="nowcoder,offershow,xiaohongshu"></label>
      <button class="primary" type="submit"><i data-lucide="radar"></i> 运行探测</button>
    </form>
  </div>

  <div class="panel span-7">
    <div class="panel-heading compact">
      <div>
        <p class="eyebrow">Latest</p>
        <h2>最近面经源结果</h2>
      </div>
      <button class="ghost" data-refresh="evaluations"><i data-lucide="refresh-cw"></i> 刷新</button>
    </div>
    <div id="interview-source-smoke-result" class="result-list"></div>
  </div>
</section>

<section class="workspace-grid">
  <div class="panel span-5">
    <div class="panel-heading compact">
      <div>
        <p class="eyebrow">LLM workflow</p>
        <h2>真实 LLM 流程评测</h2>
      </div>
    </div>
    <form id="llm-workflow-form" class="form-grid">
      <label>Case 数<input name="case_limit" type="number" min="1" max="18" value="3"></label>
      <label class="checkbox-row"><input name="resume_from_last_completed" type="checkbox"> 从上次完成处继续</label>
      <button class="primary" type="submit"><i data-lucide="activity"></i> 运行 LLM 流程</button>
    </form>
  </div>

  <div class="panel span-7">
    <div class="panel-heading compact">
      <div>
        <p class="eyebrow">Trace</p>
        <h2>最新 LLM 流程 Trace</h2>
      </div>
    </div>
    <div id="llm-workflow-result" class="result-list"></div>
  </div>
</section>

<section class="panel">
  <div class="panel-heading compact">
    <div>
      <p class="eyebrow">Human confirmation</p>
      <h2>确认导入候选面经</h2>
    </div>
  </div>
  <form id="interview-source-import-form" class="form-grid">
    <label>Job ID<input name="job_id" type="number" min="1" placeholder="可选"></label>
    <label>来源平台<input name="source_site" placeholder="牛客网 / OfferShow / 小红书" required></label>
    <label>来源链接<input name="source_url" placeholder="候选 URL，可编辑"></label>
    <label>标题<input name="title" placeholder="如 腾讯 Agent 实习一面"></label>
    <label>公司<input name="company" placeholder="可选"></label>
    <label>岗位关键词<input name="role_keyword" placeholder="如 Agent 开发实习生"></label>
    <label class="wide">确认后的面经正文<textarea name="raw_text" rows="7" required placeholder="请粘贴或补全真实面经正文；搜索摘要只能作为线索，不能直接当作完整事实"></textarea></label>
    <button class="primary" type="submit"><i data-lucide="import"></i> 确认导入面经</button>
  </form>
  <div id="interview-source-import-result" class="result-list"></div>
</section>

<section class="panel">
  <div class="panel-heading compact">
    <div>
      <p class="eyebrow">History</p>
      <h2>评测记录</h2>
    </div>
  </div>
  <div id="evaluation-runs-list" class="result-list"></div>
</section>
{% endblock %}
