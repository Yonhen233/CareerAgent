{% extends "base.html" %}
{% block content %}
<section class="panel">
  <div class="panel-heading compact">
    <div>
      <p class="eyebrow">历史记录</p>
      <h1>求职历史记录</h1>
      <p class="meta">这里用于查看一键流程和分步页面产生的运行记录、阶段进度、失败原因和需要确认的动作。</p>
    </div>
  </div>
</section>

<section class="workspace-grid run-history-grid">
  <div class="panel span-7">
    <div class="panel-heading compact">
      <div>
        <p class="eyebrow">历史记录</p>
        <h2>最近运行</h2>
      </div>
      <button class="ghost" data-refresh="runs"><i data-lucide="refresh-cw"></i> 刷新</button>
    </div>
    <div id="runs-list" class="result-list"></div>
  </div>
  <div class="panel span-5">
    <div class="panel-heading compact">
      <div>
        <p class="eyebrow">结果摘要</p>
        <h2>本次任务完成了什么</h2>
      </div>
    </div>
    <div id="run-business-summary" class="run-business-summary muted-box"></div>
    <div class="panel-heading compact nested-heading">
      <div>
        <p class="eyebrow">进度</p>
        <h2>阶段进度</h2>
      </div>
    </div>
    <div id="run-steps" class="result-list muted-box"></div>
    <div id="run-confirmation" class="result-list compact-result"></div>
    <div class="panel-heading compact nested-heading">
      <div>
        <p class="eyebrow">LangGraph</p>
        <h2>事件流</h2>
      </div>
    </div>
    <div id="run-events" class="event-timeline muted-box"></div>
  </div>
</section>
{% endblock %}
