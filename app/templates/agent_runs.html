{% extends "base.html" %}
{% block content %}
<section class="panel">
  <div class="panel-heading compact">
    <div>
      <p class="eyebrow">Observable workflow</p>
      <h1>运行 Agent</h1>
    </div>
  </div>
  <form id="agent-run-form" class="form-grid">
    <label>
      任务
      <select name="task_type">
        <option value="find_jobs_for_profile">find_jobs_for_profile</option>
        <option value="tailor_resume_for_job">tailor_resume_for_job</option>
        <option value="quick_apply">quick_apply</option>
      </select>
    </label>
    <label>Profile ID<input name="profile_id" type="number" min="1"></label>
    <label>Job ID<input name="job_id" type="number" min="1"></label>
    <label>Resume Version ID<input name="resume_version_id" type="number" min="1"></label>
    <label class="wide">Query<input name="query" value="Agent Development Intern"></label>
    <label>Limit<input name="limit" type="number" min="1" max="80" value="12"></label>
    <button class="primary" type="submit"><i data-lucide="play"></i> 创建 Run</button>
  </form>
</section>

<section class="workspace-grid">
  <div class="panel span-7">
    <div class="panel-heading compact">
      <div>
        <p class="eyebrow">Runs</p>
        <h2>执行历史</h2>
      </div>
      <button class="ghost" data-refresh="runs"><i data-lucide="refresh-cw"></i> 刷新</button>
    </div>
    <div id="runs-list" class="result-list"></div>
  </div>
  <div class="panel span-5">
    <div class="panel-heading compact">
      <div>
        <p class="eyebrow">Trace</p>
        <h2>步骤详情</h2>
      </div>
    </div>
    <div id="run-steps" class="result-list muted-box"></div>
  </div>
</section>
{% endblock %}
